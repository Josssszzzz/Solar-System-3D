<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Solar</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;
    font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#cfd6e6}
  canvas{display:block;cursor:crosshair}
  #ui{position:fixed;top:12px;left:12px;padding:10px 12px;border-radius:8px;
    background:rgba(13,18,32,.78);border:1px solid #1e2740}
  #ui label{display:flex;align-items:center;gap:8px;margin:6px 0;white-space:nowrap}
  input[type=range]{width:120px}
  button{background:#1a2340;color:#cfd6e6;border:1px solid #2c3860;
    border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit}
  #clock{margin-top:8px;opacity:.6;font-variant-numeric:tabular-nums}
  #hint{position:fixed;bottom:10px;left:14px;opacity:.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="play">⏸ Pausar</button>
  <label>Velocidad <input id="spd" type="range" min="0" max="2" step="0.01" value="0.25"></label>
  <label><input id="lbl" type="checkbox" checked> Nombres</label>
  <div id="clock"></div>
</div>
<div id="hint">Rueda del ratón = zoom · Espacio = pausa</div>
<script>
const P = [
  {n:'Mercurio', a:0.387, T:0.241,  r:2440,  c:'#9d8f84'},
  {n:'Venus',    a:0.723, T:0.615,  r:6052,  c:'#e0b872'},
  {n:'Tierra',   a:1.000, T:1.000,  r:6371,  c:'#4f8fe0'},
  {n:'Marte',    a:1.524, T:1.881,  r:3390,  c:'#c1502e'},
  {n:'Júpiter',  a:5.203, T:11.862, r:69911, c:'#d3a86a'},
  {n:'Saturno',  a:9.537, T:29.457, r:58232, c:'#e0cd94'},
  {n:'Urano',    a:19.19, T:84.02,  r:25362, c:'#87ccd8'},
  {n:'Neptuno',  a:30.07, T:164.80, r:24622, c:'#4a63c8'},
];
P.forEach((p,i) => { p.ph = i * 2.39; });

// Auto-chequeo: los datos deben cumplir la 3ª ley de Kepler (T² ∝ a³).
P.forEach(p => console.assert(Math.abs(p.T*p.T/(p.a**3) - 1) < 0.02, 'Kepler falla en '+p.n));

const c = document.getElementById('c'), ctx = c.getContext('2d');
const stars = Array.from({length:420}, () => ({
  x:Math.random(), y:Math.random(), r:Math.random()*1.1+.25, a:Math.random()*.6+.25
}));

let W, H, unit, zoom = 1, years = 0, playing = true, last = 0;
const spd = document.getElementById('spd'), lbl = document.getElementById('lbl'),
      play = document.getElementById('play'), clock = document.getElementById('clock');

const orbitR = a => Math.pow(a, 0.42);          // comprime las distancias reales
const bodyR  = r => 2.1 * Math.pow(r/6371, .42); // comprime los tamaños reales

function resize(){
  const d = devicePixelRatio || 1;
  W = c.width = innerWidth*d; H = c.height = innerHeight*d;
  c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);
  W = innerWidth; H = innerHeight;
  unit = Math.min(W,H)/2 * 0.92 / orbitR(P[P.length-1].a);
}
addEventListener('resize', resize); resize();

addEventListener('wheel', e => {
  zoom = Math.min(12, Math.max(0.4, zoom * (e.deltaY < 0 ? 1.12 : 1/1.12)));
}, {passive:true});
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
play.onclick = toggle;
function toggle(){ playing = !playing; play.textContent = playing ? '⏸ Pausar' : '▶ Reanudar'; }

function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000) || 0; last = ts;
  if (playing) years += dt * +spd.value;

  ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,W,H);
  for (const s of stars){
    ctx.globalAlpha = s.a; ctx.fillStyle = '#fff';
    ctx.fillRect(s.x*W, s.y*H, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  const cx = W/2, cy = H/2, k = unit * zoom, ps = Math.sqrt(zoom);

  ctx.strokeStyle = 'rgba(150,175,230,.13)'; ctx.lineWidth = 1;
  for (const p of P){
    ctx.beginPath(); ctx.arc(cx, cy, orbitR(p.a)*k, 0, 7); ctx.stroke();
  }

  const sr = 11 * ps;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,sr*5);
  g.addColorStop(0,'rgba(255,220,130,.55)'); g.addColorStop(1,'rgba(255,180,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,sr*5,0,7); ctx.fill();
  ctx.fillStyle = '#ffd35c'; ctx.beginPath(); ctx.arc(cx,cy,sr,0,7); ctx.fill();

  ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center';
  for (const p of P){
    const ang = p.ph + years/p.T * Math.PI*2;
    const R = orbitR(p.a)*k, x = cx + Math.cos(ang)*R, y = cy + Math.sin(ang)*R;
    const rp = Math.max(1.3, bodyR(p.r)*ps);

    if (p.n === 'Saturno'){
      ctx.save(); ctx.translate(x,y); ctx.rotate(-.45);
      ctx.strokeStyle = 'rgba(224,205,148,.75)'; ctx.lineWidth = Math.max(1, rp*.35);
      ctx.beginPath(); ctx.ellipse(0,0, rp*2.1, rp*.75, 0, 0, 7); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x,y,rp,0,7); ctx.fill();

    if (lbl.checked){
      ctx.fillStyle = 'rgba(207,214,230,.7)';
      ctx.fillText(p.n, x, y - rp - 6);
    }
  }

  clock.textContent = `${years.toFixed(2)} años · día ${Math.floor(years*365.25).toLocaleString('es')}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
